name: Verificações do projeto

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Testes, tipos, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Executar testes
        run: npm test

      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar padrões do código
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-build-validation

  database:
    name: Migrações e testes do banco local
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências pelo lockfile
        run: npm ci --no-audit --no-fund

      - name: Iniciar Supabase local
        run: npx supabase start > /dev/null

      - name: Reaplicar migrações locais
        run: npx supabase db reset --local

      - name: Verificar banco local
        run: npx supabase db lint --local --level error

      - name: Executar testes pgTAP locais
        run: npx supabase test db --local

      - name: Desligar Supabase local
        if: always()
        continue-on-error: true
        run: npx supabase stop
